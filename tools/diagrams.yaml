# 「LLM × 온톨로지」 설명 이미지 정의 — 수정 후 python tools/build_diagrams.py
theme:
  book: LLM × 온톨로지 무엇을 해야할까?
  primary: violet
  secondary: pink
  style: fun

diagrams:
  - file: ch01-triple.png
    kicker: CHAPTER 01 · 온톨로지 기초
    layout: triple
    title: 지식을 *주어–관계–목적어*로
    subtitle: 온톨로지는 개념과 관계를 컴퓨터가 이해할 수 있게 정리한 지식 지도입니다
    rows:
      - { s: { label: 서울, type: 도시, color: violet }, p: 수도이다, o: { label: 대한민국, type: 국가, color: pink } }
      - { s: { label: 도시, type: 클래스, color: indigo }, p: 하위 클래스, o: { label: 장소, type: 클래스, color: cyan } }
      - { s: { label: 대한민국, type: 국가, color: pink }, p: 속한 대륙, o: { label: 아시아, type: 대륙, color: amber } }
    note: "LLM은 이런 명확한 관계를 근거로 삼을 때 환각이 줄어듭니다"

  - file: ch02-standards.png
    kicker: CHAPTER 02 · 표준과 언어
    layout: stack
    title: 온톨로지 *표준 스택*
    subtitle: 아래층 위에 위층이 쌓이는 구조입니다
    layers:
      - { icon: "✅", title: SHACL, desc: "데이터가 규칙(형태)을 지키는지 검증", color: emerald }
      - { icon: "🧠", title: OWL, desc: "추론 가능한 풍부한 의미: 동치·제약·속성 특성", color: violet }
      - { icon: "🗂️", title: RDFS · SKOS, desc: "클래스·속성 계층(RDFS), 용어 체계·동의어(SKOS)", color: indigo }
      - { icon: "🔗", title: RDF, desc: "모든 지식을 (주어, 관계, 목적어) 트리플로 표현", color: pink }

  - file: ch03-query.png
    tone: neutral
    kicker: CHAPTER 03 · 지식그래프와 질의
    layout: compare
    title: 두 가지 *그래프 저장 방식*
    left:
      title: 트리플스토어 + SPARQL
      items:
        - "RDF 표준 기반, 다른 데이터와 연결 쉬움"
        - "OWL 추론과 함께 쓰기 좋음"
        - "공공·학술 데이터에서 많이 사용"
    right:
      title: 그래프DB + Cypher
      items:
        - "노드·관계에 속성을 자유롭게 부여"
        - "직관적인 질의 문법, 개발자 친화적"
        - "서비스·추천·GraphRAG에서 많이 사용"
    note: "어느 쪽이 정답은 아닙니다 — 표준 연계가 중요하면 RDF, 서비스 개발이 중심이면 그래프DB"

  - file: ch04-llm-build.png
    kicker: CHAPTER 04 · LLM으로 온톨로지 만들기
    layout: flow
    title: LLM과 함께 *온톨로지 만들기*
    steps:
      - { icon: "📄", title: 문서 준비, desc: "도메인 문서·\n용어집 모으기", color: indigo }
      - { icon: "🔍", title: 개념 추출, desc: "LLM이 핵심 개념·\n동의어 후보 추출", color: violet }
      - { icon: "🔗", title: 관계 추출, desc: "개념 사이 관계를\n트리플로 생성", color: pink }
      - { icon: "🧑‍🔬", title: 사람 검토, desc: "전문가가 승인·\n수정·병합", color: amber }
      - { icon: "✅", title: 검증, desc: "SHACL·추론기로\n일관성 점검", color: emerald }
    note: "LLM은 후보를 빠르게 만들고, 최종 결정은 사람이 합니다"

  - file: ch05-graphrag.png
    kicker: CHAPTER 05 · 온톨로지로 LLM 강화
    layout: flow
    title: "*GraphRAG* 동작 방식"
    subtitle: 질문과 관련된 지식그래프 부분을 찾아 LLM에게 근거로 제공합니다
    steps:
      - { icon: "❓", title: 질문, desc: "사용자 질문에서\n개체·관계 파악", color: indigo }
      - { icon: "🕸️", title: 그래프 탐색, desc: "관련 노드와\n이웃 관계 검색", color: violet }
      - { icon: "📚", title: 근거 구성, desc: "찾은 사실을\n문맥으로 정리", color: pink }
      - { icon: "💬", title: 답변 생성, desc: "LLM이 근거를\n인용하며 답변", color: emerald }

  - file: ch06-quality.png
    kicker: CHAPTER 07 · 평가와 품질
    layout: cards
    columns: 3
    title: 무엇을 *평가*하나
    cards:
      - { icon: "🎯", title: 정확성, desc: "추출한 개념·관계가\n실제로 맞는가", color: violet }
      - { icon: "🧩", title: 완전성, desc: "필요한 개념과 관계가\n빠짐없이 있는가", color: indigo }
      - { icon: "⚖️", title: 일관성, desc: "서로 모순되는\n정의가 없는가", color: emerald }

  - file: ch07-projects.png
    kicker: CHAPTER 08 · 실전 프로젝트
    layout: cards
    columns: 3
    title: 세 가지 *실전 프로젝트*
    cards:
      - { icon: "💹", title: 금융 온톨로지, desc: "기업·산업·공급망 관계\n→ 퀀트 투자 아이디어", color: indigo }
      - { icon: "🔐", title: 개인정보 온톨로지, desc: "개인정보 항목·식별 위험\n→ 가명처리 자동화", color: pink }
      - { icon: "🏢", title: 사내 지식 온톨로지, desc: "조직·업무·문서 관계\n→ 사내 질의응답", color: violet }

  - file: ch08-trends.png
    kicker: CHAPTER 09 · 최신 동향
    layout: flow
    title: 동향을 *기록*하는 방법
    steps:
      - { icon: "📰", title: 수집, desc: "논문·도구 릴리스\n소식 메모", color: violet }
      - { icon: "🧪", title: 실험, desc: "책의 예제에\n직접 적용", color: pink }
      - { icon: "📝", title: 기록, desc: "업데이트 노트에\n변화와 근거 기록", color: indigo }

  - file: ch90-appendix.png
    kicker: 부록
    layout: cards
    columns: 2
    title: 부록 *활용법*
    cards:
      - { icon: "🧰", title: 도구 비교, desc: "편집기·트리플스토어·그래프DB·\n라이브러리 비교", color: violet }
      - { icon: "📖", title: 용어집, desc: "트리플·클래스·IRI·추론 등\n핵심 용어 풀이", color: pink }

  # ---------- 페이지 이미지 ----------
  - file: p01-3-taxonomy.png
    kicker: 01-3 · 택소노미·시소러스와의 차이
    layout: stack
    title: 지식 표현의 *단계*
    subtitle: 위로 갈수록 표현할 수 있는 의미가 풍부해집니다
    layers:
      - { icon: "🧠", title: 온톨로지, desc: "개념 + 다양한 관계 + 규칙 → 추론 가능 (예: 의사는 사람이다, 환자를 진료한다)", color: violet }
      - { icon: "📚", title: 시소러스, desc: "상하위 + 동의어·관련어 (예: 자동차 = 승용차, 관련: 도로)", color: pink }
      - { icon: "🌳", title: 택소노미, desc: "상하위 분류만 (예: 동물 → 포유류 → 고양이)", color: indigo }
      - { icon: "🏷️", title: 용어 목록, desc: "단어 나열 (예: 고객, 주문, 상품)", color: slate }

  # ---------- 02~08장 페이지 이미지 ----------
  - file: p02-1-turtle.png
    tone: neutral
    arrow: true
    kicker: 02-1 · RDF와 트리플
    layout: compare
    title: 같은 사실, *두 가지 표기*
    subtitle: 표 형식으로 생각한 사실을 Turtle 문법으로 적으면 컴퓨터가 읽을 수 있습니다
    left:
      title: 사람이 쓰는 말
      items:
        - "A전자는 회사다"
        - "A전자의 이름은 'A전자'다"
        - "B소재는 A전자에 공급한다"
    right:
      title: RDF (Turtle)
      items:
        - "ex:AElec  a  ex:Company ."
        - "ex:AElec  rdfs:label  \"A전자\"@ko ."
        - "ex:BMat  ex:suppliesTo  ex:AElec ."

  - file: p02-2-inference.png
    kicker: 02-2 · RDFS와 OWL
    layout: flow
    title: 적힌 사실 + 규칙 = *새로운 사실*
    subtitle: 추론은 직접 적지 않은 사실을 규칙에서 이끌어 냅니다
    steps:
      - { icon: "📝", title: 적힌 사실, desc: "김민준은 직원이다\nA전자는 C전자와\n경쟁한다", color: indigo }
      - { icon: "📏", title: 규칙, desc: "직원 ⊂ 사람\n경쟁한다는\n대칭 관계", color: violet }
      - { icon: "✨", title: 추론 결과, desc: "김민준은 사람이다\nC전자는 A전자와\n경쟁한다", color: pink }

  - file: p02-4-shacl.png
    kicker: 02-4 · SHACL
    layout: compare
    title: SHACL이 *잡아내는* 오류
    subtitle: 규칙(Shape)을 정해 두면 잘못된 데이터를 자동으로 찾아냅니다
    left:
      title: 들어온 데이터
      items:
        - "E전자 — 이름 없음"
        - "E전자 설립연도 = 1750"
        - "E전자 —공급한다→ 서울(도시)"
    right:
      title: SHACL 검증 메시지
      items:
        - "회사에는 이름(label)이 있어야 합니다"
        - "설립연도는 1800 이상의 정수 하나여야 합니다"
        - "공급 대상은 회사여야 합니다"

  - file: p03-2-multihop.png
    kicker: 03-2 · SPARQL 기초
    layout: triple
    title: 관계를 *여러 단계* 따라가기
    subtitle: "질문: A전자 공급망 기업 중 경쟁사 C전자에도 납품하는 곳은?"
    rows:
      - { s: { label: D화학, type: 2단계 공급사, color: violet }, p: 공급한다, o: { label: B소재, type: 1단계 공급사, color: indigo } }
      - { s: { label: B소재, type: 1단계 공급사, color: indigo }, p: 공급한다, o: { label: A전자, type: 기준 회사, color: pink } }
      - { s: { label: D화학, type: 답, color: violet }, p: 공급한다, o: { label: C전자, type: A전자의 경쟁사, color: amber } }
    note: "SPARQL 속성 경로(ex:suppliesTo+)로 몇 단계든 한 번에 따라갈 수 있습니다"

  - file: p03-4-modeling.png
    kicker: 03-4 · 모델링 실습
    layout: flow
    title: 질문에서 시작하는 *모델링 5단계*
    steps:
      - { icon: "❓", title: 질문 목록, desc: "답하고 싶은\n질문 10개 쓰기", color: indigo }
      - { icon: "🏷️", title: 개념 고르기, desc: "질문에 나온\n명사 → 클래스", color: violet }
      - { icon: "🔗", title: 관계 정하기, desc: "질문에 나온\n동사 → 속성", color: pink }
      - { icon: "🗃️", title: 데이터 채우기, desc: "샘플 데이터\n20~50개", color: amber }
      - { icon: "✅", title: 질의로 검증, desc: "처음 질문이\nSPARQL로 풀리나", color: emerald }

  - file: p04-1-extract.png
    kicker: 04-1 · 개념 추출
    layout: cards
    columns: 3
    title: LLM에게 *개념 후보*를 받는 세 가지 방법
    cards:
      - { icon: "📄", title: 문서에서 명사 추출, desc: "자주 나오는 핵심 용어와\n정의 문장을 함께 뽑기", color: indigo }
      - { icon: "🧩", title: 동의어 묶기, desc: "같은 개념의 다른 표현을\n하나의 대표어로 묶기", color: violet }
      - { icon: "🌳", title: 상하위 제안, desc: "개념 사이의 상하위\n관계 후보 제안받기", color: pink }
    note: "후보에는 반드시 근거 문장을 붙이게 하고, 최종 결정은 사람이 합니다"

  - file: p04-4-review.png
    kicker: 04-4 · 사람의 검토 절차
    layout: flow
    title: LLM 추출 결과 *검토 파이프라인*
    steps:
      - { icon: "🤖", title: LLM 추출, desc: "트리플 +\n근거 문장", color: indigo }
      - { icon: "🧮", title: 자동 검사, desc: "허용 관계?\n근거가 원문에?\n기존 개체?", color: violet }
      - { icon: "✅", title: 자동 반영, desc: "모든 검사 통과한\n사실만", color: emerald }
      - { icon: "🧑‍🔬", title: 사람 검토, desc: "새 개체·새 관계·\n환각 의심", color: amber }
      - { icon: "📒", title: 기록, desc: "누가·언제·왜\n승인했는지", color: pink }

  - file: p05-3-grounding.png
    kicker: 05-3 · 환각 줄이기와 근거 제시
    layout: compare
    title: 근거가 *있는* 답과 *없는* 답
    left:
      title: 근거 없는 답
      items:
        - "A전자의 공급사는 B소재와 F모터스입니다"
        - "출처를 확인할 방법이 없음"
        - "F모터스는 데이터에 없는 회사(환각)"
    right:
      title: 지식그래프 근거로 답
      items:
        - "B소재가 A전자에 공급합니다 [4]"
        - "D화학은 B소재에 공급합니다 [8]"
        - "그 외 공급사는 근거 없음"

  - file: p06-1-metrics.png
    kicker: 07-1 · 품질 지표
    layout: cards
    columns: 3
    title: 추출 품질을 재는 *세 가지 숫자*
    subtitle: "예시: 정답 4개, 추출 4개, 맞힌 것 3개"
    cards:
      - { icon: "🎯", title: 정밀도 0.75, desc: "뽑은 것 중 맞은 비율\n= 3 ÷ 4\n\n낮으면 환각이 많음", color: violet }
      - { icon: "🧺", title: 재현율 0.75, desc: "정답 중 뽑아낸 비율\n= 3 ÷ 4\n\n낮으면 놓친 사실이 많음", color: indigo }
      - { icon: "⚖️", title: F1 0.75, desc: "정밀도와 재현율의\n조화 평균\n\n하나로 비교할 때 사용", color: emerald }

  - file: p07-2-privacy.png
    kicker: 08-2 · 개인정보 항목 온톨로지
    layout: stack
    title: 개인정보 항목을 *위험도별로* 분류
    subtitle: 온톨로지로 항목을 분류해 두면 가명처리 방법을 자동으로 추천할 수 있습니다
    layers:
      - { icon: "🪪", title: 식별자, desc: "이름 · 주민등록번호 · 휴대폰 번호 → 삭제 또는 대체", color: red }
      - { icon: "🧩", title: 준식별자, desc: "생년월일 · 우편번호 · 직업 → 범주화 · 라운딩", color: amber }
      - { icon: "🩺", title: 민감정보, desc: "건강 · 질병 정보 → 추가 보호조치, 필요 시 삭제", color: violet }
      - { icon: "📊", title: 일반 속성, desc: "구매액 · 방문 횟수 → 분석용으로 유지 (이상치 점검)", color: emerald }

  - file: p07-3-company.png
    kicker: 08-3 · 사내 지식 온톨로지
    layout: triple
    title: 사내 질문에 답하는 *지식그래프*
    subtitle: "질문: 결제 시스템 장애가 나면 누구에게 연락해야 하나?"
    rows:
      - { s: { label: 결제 시스템, type: 시스템, color: violet }, p: 담당 팀, o: { label: 플랫폼팀, type: 팀, color: indigo } }
      - { s: { label: 플랫폼팀, type: 팀, color: indigo }, p: 당직자, o: { label: 박지훈, type: 직원, color: pink } }
      - { s: { label: 결제 시스템, type: 시스템, color: violet }, p: 장애 대응 문서, o: { label: 결제 장애 매뉴얼, type: 문서, color: amber } }
    note: "이름과 시스템은 모두 가상의 예시입니다"

  # ---------- 06장 RAG와 LLM 시스템 설계 ----------
  - file: ch06-rag-system.png
    kicker: CHAPTER 06 · RAG와 LLM 시스템 설계
    layout: flow
    title: 지식 기반 LLM 시스템의 *질문 처리 흐름*
    subtitle: 질문 유형에 따라 문서·그래프를 골라 찾고, 근거로 답하고, 검증합니다
    steps:
