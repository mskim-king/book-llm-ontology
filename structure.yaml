# 「LLM × 온톨로지」 구조 정의 — 이 파일을 고치고 python generate.py 실행
book:
  title: LLM × 온톨로지 무엇을 해야할까?
  subtitle: 지식그래프로 더 똑똑한 AI 만들기
  author: 저자명
  audience: AI 개발자, 데이터 설계자, 지식관리 실무자
  description: >
    온톨로지와 지식그래프의 기초부터, LLM으로 온톨로지를 구축하고
    온톨로지로 LLM의 정확도를 높이는 방법(GraphRAG 등)까지 실습 중심으로 정리합니다.
  review_days: 90
  show_drafts: false
series:
  name: AI 시대 데이터 실무 4부작
  books:   # 위키독스 공개 후 url 을 채우면 README 에 링크가 생깁니다
    - { title: "AI 300% 활용법", url: "" }
    - { title: "가명정보 A to Z", url: "" }
    - { title: "파이썬으로 시작하는 실전 퀀트 투자", url: "" }
    - { title: "LLM × 온톨로지 무엇을 해야할까?", url: "" }

chapters:
  - id: "01"
    slug: basics
    title: 온톨로지 기초
    summary: 온톨로지가 무엇이고 왜 LLM 시대에 다시 주목받는지, 기본 구성 요소를 알아봅니다.
    pages:
      - { slug: what-is,     title: 온톨로지란 무엇인가, tags: [기초] }
      - { slug: elements,    title: 개념·클래스·속성·관계, tags: [기초] }
      - { slug: vs-taxonomy, title: 택소노미·시소러스와의 차이, tags: [기초] }
      - { slug: why-llm,     title: 왜 LLM 시대에 온톨로지인가, tags: [기초, LLM] }

  - id: "02"
    slug: standards
    title: 표준과 언어
    summary: RDF·RDFS·OWL·SKOS·SHACL 등 온톨로지를 표현하는 표준을 실습합니다.
    pages:
      - { slug: rdf,    title: RDF와 트리플, tags: [표준], template: code }
      - { slug: rdfs-owl, title: RDFS와 OWL, tags: [표준], template: code }
      - { slug: skos,   title: SKOS로 용어 체계 만들기, tags: [표준] }
      - { slug: shacl,  title: SHACL로 데이터 검증하기, tags: [표준, 검증], template: code }

  - id: "03"
    slug: knowledge-graph
    title: 지식그래프와 질의
    summary: 지식그래프를 저장하고 SPARQL·Cypher로 질의하는 방법을 다룹니다.
    pages:
      - { slug: store,   title: 트리플스토어 vs 그래프 데이터베이스, tags: [지식그래프] }
      - { slug: sparql,  title: SPARQL 기초, tags: [지식그래프, 질의], template: code }
      - { slug: cypher,  title: Cypher 기초, tags: [지식그래프, 질의], template: code }
      - { slug: modeling, title: 지식그래프 모델링 실습, tags: [지식그래프] }

  - id: "04"
    slug: llm-builds-ontology
    title: LLM으로 온톨로지 만들기
    summary: LLM으로 문서에서 개념과 관계를 추출해 온톨로지를 만드는 과정입니다.
    pages:
      - { slug: concept-extract,  title: 문서에서 개념 추출, tags: [LLM, 추출], see_also: ["AI 300% 활용법 — 구조화된 출력 받기"] }
      - { slug: relation-extract, title: 관계 추출과 트리플 생성, tags: [LLM, 추출], template: code }
      - { slug: alignment,        title: 기존 온톨로지와 정렬·병합, tags: [LLM] }
      - { slug: human-review,     title: 사람의 검토 절차 설계, tags: [LLM, 검증] }

  - id: "05"
    slug: ontology-boosts-llm
    title: 온톨로지로 LLM 강화
    summary: 온톨로지와 지식그래프로 LLM의 정확도를 높이는 GraphRAG 등을 다룹니다.
    pages:
      - { slug: schema-guided, title: 스키마 기반 정보 추출, tags: [LLM], template: code }
      - { slug: graphrag,      title: GraphRAG 이해와 구현, tags: [LLM, RAG], template: code }
      - { slug: grounding,     title: 환각 줄이기와 근거 제시, tags: [LLM, 검증] }
      - { slug: agents,        title: 온톨로지 기반 AI 에이전트, tags: [LLM, 에이전트] }

  - id: "06"
    slug: evaluation
    title: 평가와 품질
    summary: 온톨로지와 GraphRAG의 품질을 측정하고 점검하는 방법입니다.
    pages:
      - { slug: metrics,     title: 온톨로지 품질 지표, tags: [평가] }
      - { slug: consistency, title: 논리적 일관성 검사, tags: [평가] }
      - { slug: rag-eval,    title: GraphRAG 성능 평가, tags: [평가, RAG] }

  - id: "07"
    slug: projects
    title: 실전 프로젝트
    summary: 금융·개인정보·사내 지식 온톨로지를 직접 만들어 봅니다.
    pages:
      - { slug: finance,  title: 금융 온톨로지 구축, tags: [프로젝트, 금융], see_also: ["파이썬으로 시작하는 실전 퀀트 투자 — 금융 지식그래프"] }
      - { slug: privacy,  title: 개인정보 항목 온톨로지, tags: [프로젝트, 개인정보], see_also: ["가명정보 A to Z — AI 시대의 가명정보"] }
      - { slug: company,  title: 사내 지식 온톨로지, tags: [프로젝트] }

  - id: "08"
    slug: trends
    title: 최신 동향
    summary: 빠르게 변하는 기법과 도구의 변화를 기록합니다.
    pages:
      - { slug: updates, title: 기법·도구 업데이트 노트, tags: [동향] }

  - id: "90"
    slug: appendix
    title: 부록
    summary: 도구 비교와 용어집을 모았습니다.
    pages:
      - { slug: tools,    title: 도구 비교, tags: [부록, 도구] }
      - { slug: glossary, title: 용어집, tags: [부록] }
